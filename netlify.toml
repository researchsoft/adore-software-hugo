[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.147.0"
  HUGO_ENABLEGITINFO = "false"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true

# URL redirects: old WordPress paths → new Hugo paths
[[redirects]]
  from = "/about/faq/"
  to = "/faq/"
  status = 301

# /about/ duplicates /about/about-adore/ — send it to the canonical page.
# force = true so this applies even though Hugo emits /about/index.html.
[[redirects]]
  from = "/about/"
  to = "/about/about-adore/"
  status = 301
  force = true
