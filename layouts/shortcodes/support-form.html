<form name="supporter" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="support-form mt-4">
  <input type="hidden" name="form-name" value="supporter" />
  <p class="d-none">
    <label>Don't fill this out: <input name="bot-field" /></label>
  </p>
  <div class="row">
    <div class="col-sm-6 mb-3">
      <label for="support-first-name" class="form-label">First name <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="support-first-name" name="first-name" required />
    </div>
    <div class="col-sm-6 mb-3">
      <label for="support-last-name" class="form-label">Last name <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="support-last-name" name="last-name" required />
    </div>
  </div>
  <div class="mb-3">
    <label for="support-organisation" class="form-label">Organisation</label>
    <input type="text" class="form-control" id="support-organisation" name="organisation" />
  </div>
  <div class="mb-3">
    <label for="support-website" class="form-label">Organisation or personal website</label>
    <input type="url" class="form-control" id="support-website" name="website" />
  </div>
  <div class="mb-3">
    <label for="support-representation" class="form-label">Support representation <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="support-representation" name="representation" required />
  </div>
  <div class="mb-3">
    <label for="support-email" class="form-label">Email address <span class="text-danger">*</span></label>
    <input type="email" class="form-control" id="support-email" name="email" required />
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="support-privacy" name="privacy-consent" required />
    <label class="form-check-label" for="support-privacy">I accept ADORE's <a href="/privacy-policy/">Privacy Policy</a> <span class="text-danger">*</span></label>
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="support-newsletter" name="newsletter" />
    <label class="form-check-label" for="support-newsletter">I would like to receive the ReSA newsletter with updates about ADORE.software</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
<p class="mt-3 text-muted small">By using this form you agree with our <a href="/privacy-policy/">Privacy Policy</a>.</p>
