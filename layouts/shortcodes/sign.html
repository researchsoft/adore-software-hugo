<form name="signatory" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" action="/thank-you-signatory/" class="sign-form mt-4">
  <input type="hidden" name="form-name" value="signatory" />
  <p class="d-none">
    <label>Don't fill this out: <input name="bot-field" /></label>
  </p>

  <div class="mb-4">
    <label class="form-label fw-bold">Are you signing as an individual or an organisation? <span class="text-danger">*</span></label>
    <div class="form-check">
      <input type="radio" class="form-check-input" id="sign-type-individual" name="signing-type" value="Individual" required aria-required="true" />
      <label class="form-check-label" for="sign-type-individual">Individual signatory</label>
    </div>
    <div class="form-check">
      <input type="radio" class="form-check-input" id="sign-type-organisation" name="signing-type" value="Organisation" />
      <label class="form-check-label" for="sign-type-organisation">Organisational signatory</label>
    </div>
  </div>

  <!-- Individual branch: the signatory is the person themselves. -->
  <fieldset class="mb-4 signing-fields" data-show-for="Individual" hidden>
    <legend class="h5">Your details</legend>
    <div class="row">
      <div class="col-sm-6 mb-3">
        <label for="ind-first-name" class="form-label">First name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="ind-first-name" name="individual-first-name" required aria-required="true" />
      </div>
      <div class="col-sm-6 mb-3">
        <label for="ind-last-name" class="form-label">Last name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="ind-last-name" name="individual-last-name" required aria-required="true" />
      </div>
    </div>
    <div class="mb-3">
      <label for="ind-email" class="form-label">Email address <span class="text-danger">*</span></label>
      <input type="email" class="form-control" id="ind-email" name="email" required aria-required="true" />
    </div>
    <div class="mb-3">
      <label for="ind-website" class="form-label">Personal website</label>
      <input type="url" class="form-control" id="ind-website" name="personal-website" />
    </div>
  </fieldset>

  <!-- Organisation branch: signatory is the organisation; a representative submits on its behalf. -->
  <fieldset class="mb-4 signing-fields" data-show-for="Organisation" hidden>

    <div class="mb-3">

    </div>
    <div class="mb-3">

    <div class="mb-3">
      <label for="org-logo" class="form-label">Official organisation logo</label>
      <input type="file" class="form-control" id="org-logo" name="logo" accept="image/png,image/jpeg" />
      <div class="form-text">Upload a JPG or PNG of your organisation's logo to be displayed on our website.</div>
    </div>

<script>
  // Show only the fields relevant to the chosen signatory type. Hidden groups
  // are also disabled so their (required) fields don't block form submission
  // or get sent to Netlify. Mirrors the live site's conditional behaviour.
  (function () {
    var form = document.querySelector('form[name="signatory"]');
    if (!form) return;
    var radios = form.querySelectorAll('input[name="signing-type"]');
    var groups = form.querySelectorAll('[data-show-for]');
    function apply() {
      var checked = form.querySelector('input[name="signing-type"]:checked');
      var value = checked ? checked.value : null;
      groups.forEach(function (group) {
        var show = group.getAttribute('data-show-for') === value;
        group.hidden = !show;
        group.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = !show;
        });
      });
    }
    radios.forEach(function (r) { r.addEventListener('change', apply); });
    apply();
  })();
</script>
