<form name="signatory" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="sign-form mt-4">
  <input type="hidden" name="form-name" value="signatory" />
  <p class="d-none">
    <label>Don't fill this out: <input name="bot-field" /></label>
  </p>
  <div class="mb-3">
    <label class="form-label fw-bold">Signing as <span class="text-danger">*</span></label>
    <div class="form-check">
      <input type="radio" class="form-check-input" id="sign-type-individual" name="signing-type" value="Individual" required />
      <label class="form-check-label" for="sign-type-individual">Individual</label>
    </div>
    <div class="form-check">
      <input type="radio" class="form-check-input" id="sign-type-organisation" name="signing-type" value="Organisation" />
      <label class="form-check-label" for="sign-type-organisation">Organisation</label>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-6 mb-3">
      <label for="sign-first-name" class="form-label">First name <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="sign-first-name" name="first-name" required />
    </div>
    <div class="col-sm-6 mb-3">
      <label for="sign-last-name" class="form-label">Last name <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="sign-last-name" name="last-name" required />
    </div>
  </div>
  <div class="mb-3">
    <label for="sign-organisation" class="form-label">Organisation</label>
    <input type="text" class="form-control" id="sign-organisation" name="organisation" />
  </div>
  <div class="mb-3">
    <label for="sign-website" class="form-label">Organisation or personal website</label>
    <input type="url" class="form-control" id="sign-website" name="website" />
  </div>
  <div class="mb-3">
    <label for="sign-email" class="form-label">Email address <span class="text-danger">*</span></label>
    <input type="email" class="form-control" id="sign-email" name="email" required />
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="sign-privacy" name="privacy-consent" required />
    <label class="form-check-label" for="sign-privacy">I accept ADORE's <a href="/privacy-policy/">Privacy Policy</a> <span class="text-danger">*</span></label>
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="sign-newsletter" name="newsletter" />
    <label class="form-check-label" for="sign-newsletter">I would like to receive the ReSA newsletter with updates about ADORE.software</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
<p class="mt-3 text-muted small">By using this form you agree with our <a href="/privacy-policy/">Privacy Policy</a>.</p>
