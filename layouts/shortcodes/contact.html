<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="contact-form mt-4">
  <input type="hidden" name="form-name" value="contact" />
  <p class="d-none">
    <label>Don't fill this out: <input name="bot-field" /></label>
  </p>
  <div class="mb-3">
    <label for="contact-name" class="form-label">Name</label>
    <input type="text" class="form-control" id="contact-name" name="name" required />
  </div>
  <div class="mb-3">
    <label for="contact-email" class="form-label">Email</label>
    <input type="email" class="form-control" id="contact-email" name="email" required />
  </div>
  <div class="mb-3">
    <label for="contact-message" class="form-label">Message</label>
    <textarea class="form-control" id="contact-message" name="message" rows="5" required></textarea>
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="contact-newsletter" name="newsletter" />
    <label class="form-check-label" for="contact-newsletter">Subscribe to the ReSA newsletter</label>
  </div>
  <button type="submit" class="btn btn-primary">Send Message</button>
</form>
<p class="mt-3 text-muted small">By using this form you agree with our <a href="/privacy-policy/">Privacy Policy</a>.</p>
