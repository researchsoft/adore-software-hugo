{{- $bg := resources.Get "header_bg_landing_2@2x-scaled.jpg" | fingerprint -}}
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#015f5e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  #navbar-main {
    background-image: url('{{ $bg.RelPermalink }}');
    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    background-repeat: no-repeat;
    /* Solid brand teal behind the hero image. The navbar is sticky (#124), so
       once it scrolls over light page content it must never be transparent or
       the white text/logo become unreadable. The image layers on top of this
       colour (background-attachment: fixed keeps the same dark region behind
       the bar as it travels); the teal is a guaranteed fallback for when the
       image is unavailable or `fixed` attachment is ignored (some mobile
       browsers). rgb(1,95,94) === $brand-teal in assets/scss/custom.scss. */
    background-color: rgb(1, 95, 94) !important;
  }
  #hero {
    background-image: url('{{ $bg.RelPermalink }}');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  .footer-brand-section {
    background-image: url('{{ $bg.RelPermalink }}');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
</style>
